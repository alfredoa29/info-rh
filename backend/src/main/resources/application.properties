
#Data source

#OJO! Estos datos los utiliza el docker-compose, si quiere hacer pruebas y que el programa no se caiga con un IDE,
#remplace  todo esto ${xxx} por datos quemados correctos

#datos m sql server

spring.datasource.url= jdbc:sqlserver://${DB_IP}:${DB_PORT};encrypt=true;trustServerCertificate=true;databaseName=${DB_NAME}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.SQLServerDialect


#Imprime en la consola las instrucciones hechas en la base de datos.
spring.jpa.show-sql = true

#[Opcional]Crea las tablas.
#spring.jpa.hibernate.ddl-auto=create
# actualiza  las tablas, no elimina.
spring.jpa.hibernate.ddl-auto=update

#MySQL : com.mysql.jdbc.MysqlDataTruncation: Data truncation: Data too long for column 'quiosco_personal'

server.error.include-message=always
server.error.include-binding-errors=always
spring.main.allow-circular-references=true



spring.mail.properties.mail.smtp.connecttimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.port= 587
spring.mail.host=${MAIL_HOST}
spring.mail.password= ${MAIL_PASSWORD}
spring.mail.username= ${MAIL_USERNAME}
spring.mail.properties.mail.smtp.starttls.enable=true
security.require-ssl=true
spring.mail.properties.mail.smpt.auth=true